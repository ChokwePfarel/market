<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Secure Payment | Study Market</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #ffffff;
            color: #000000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            padding: 16px;
        }

        .box {
            width: min(440px, calc(100% - 32px));
            padding: 48px 32px 40px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
        }

        .logo {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: #000000;
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        h1 {
            margin: 0 0 10px;
            color: #000000;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: #666666;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 4px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            margin: 28px auto 0;
            border: 3px solid #e5e5e5;
            border-top-color: #000000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 12px;
            background: #f7f7f7;
            color: #000000;
            font-size: 14px;
            border: 1px solid #e5e5e5;
        }

        .error-icon {
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .back {
            display: none;
            margin-top: 24px;
            color: #000000;
            font-weight: 600;
            text-decoration: none;
            font-size: 15px;
            padding: 12px 28px;
            border: 2px solid #000000;
            border-radius: 50px;
            transition: all 0.2s ease;
            background: transparent;
        }

        .back:hover {
            background: #000000;
            color: #ffffff;
        }

        .secure-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            padding: 6px 14px;
            background: #f7f7f7;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 500;
            color: #555555;
            letter-spacing: 0.3px;
        }

        .secure-badge .lock {
            font-size: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .box {
                padding: 36px 20px 32px;
            }

            h1 {
                font-size: 21px;
            }

            .logo {
                width: 48px;
                height: 48px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

<div class="box">
    <div class="logo">SM</div>
    <h1>Secure Payment</h1>
    <p class="subtitle" id="message">Preparing your secure checkout...</p>
    <div class="spinner" id="spinner"></div>

    <div class="error" id="error">

        We could not start the payment. Please return to Study Market and try again.
    </div>

    <a class="back" id="back" href="/">Return to Study Market</a>


</div>

<script>
    (function() {
        const params = new URLSearchParams(window.location.search);
        const checkoutUrl = params.get("url");

        const message = document.getElementById("message");
        const spinner = document.getElementById("spinner");
        const error = document.getElementById("error");
        const back = document.getElementById("back");

        function showError() {
            message.textContent = "Payment could not be started.";
            spinner.style.display = "none";
            error.style.display = "block";
            back.style.display = "inline-block";
        }

        if (!checkoutUrl) {
            showError();
            return;
        }

        let parsed;

        try {
            parsed = new URL(checkoutUrl);
        } catch (_) {
            showError();
            return;
        }

        /*
         * Security check:
         * Only allow redirects to Yoco domains to prevent open redirect vulnerabilities.
         */
        const hostname = parsed.hostname.toLowerCase();
        const isYoco =
            parsed.protocol === "https:" &&
            (hostname === "yoco.com" || hostname.endsWith(".yoco.com"));

        if (!isYoco) {
            showError();
            return;
        }

        message.textContent = "Redirecting to Yoco secure checkout...";

        // Give the browser a moment to render the message before navigating.
        setTimeout(function() {
            window.location.replace(parsed.href);
        }, 250);
    })();
</script>

</body>
</html>
