<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Secure Payment | MarketplaceApp</title>
    <style>
        * { box-sizing: border-box; }

        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: #f5f8fc;
          color: #142033;
          font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .box {
          width: min(460px, calc(100% - 32px));
          padding: 38px 28px;
          text-align: center;
          background: #fff;
          border: 1px solid #e6eaf0;
          border-radius: 22px;
          box-shadow: 0 20px 50px rgba(8,26,51,.08);
        }

        .logo {
          width: 48px;
          height: 48px;
          margin: 0 auto 18px;
          border-radius: 15px;
          display: grid;
          place-items: center;
          background: #1463ff;
          color: #fff;
          font-size: 21px;
          font-weight: 900;
        }

        h1 {
          margin: 0 0 10px;
          color: #081a33;
          font-size: 25px;
        }

        p {
          margin: 0;
          color: #667085;
          line-height: 1.6;
        }

        .spinner {
          width: 34px;
          height: 34px;
          margin: 24px auto;
          border: 4px solid #e7edf7;
          border-top-color: #1463ff;
          border-radius: 50%;
          animation: spin .8s linear infinite;
        }

        .error {
          display: none;
          margin-top: 20px;
          padding: 14px;
          border-radius: 12px;
          background: #fff2f2;
          color: #a61b1b;
          font-size: 14px;
        }

        .back {
          display: none;
          margin-top: 20px;
          color: #1463ff;
          font-weight: 700;
          text-decoration: none;
        }

        @keyframes spin {
          to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="box">
    <div class="logo">M</div>
    <h1>Secure payment</h1>
    <p id="message">Preparing your secure Yoco checkout...</p>
    <div class="spinner" id="spinner"></div>

    <div class="error" id="error">
        We could not start the payment. Please return to MarketplaceApp and try again.
    </div>

    <a class="back" id="back" href="/">Return to MarketplaceApp</a>
</div>

<script>
    (function () {
      const params = new URLSearchParams(window.location.search);

      // Your Firebase Function should send the Yoco checkout URL
      // using the "url" query parameter.
      const checkoutUrl = params.get("url");

      const message = document.getElementById("message");
      const spinner = document.getElementById("spinner");
      const error = document.getElementById("error");
      const back = document.getElementById("back");

      function showError() {
        message.textContent = "Payment could not be started.";
        spinner.style.display = "none";
        error.style.display = "block";
        back.style.display = "inline-block";
      }

      if (!checkoutUrl) {
        showError();
        return;
      }

      let parsed;

      try {
        parsed = new URL(checkoutUrl);
      } catch (_) {
        showError();
        return;
      }

      /*
       * Security check:
       * Never allow this page to become a general-purpose open redirect.
       *
       * Yoco's checkout URL should be HTTPS and hosted on a Yoco domain.
       * If Yoco gives your integration a different official checkout hostname,
       * update this allow-list accordingly.
       */
      const hostname = parsed.hostname.toLowerCase();
      const isYoco =
        parsed.protocol === "https:" &&
        (hostname === "yoco.com" || hostname.endsWith(".yoco.com"));

      if (!isYoco) {
        showError();
        return;
      }

      message.textContent = "Redirecting to Yoco secure checkout...";

      // Give the browser a moment to render the message before navigating.
      setTimeout(function () {
        window.location.replace(parsed.href);
      }, 250);
    })();
</script>

</body>
</html>
